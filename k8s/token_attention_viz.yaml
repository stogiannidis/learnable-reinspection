apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-token-attn-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-token-attn
    spec:
      containers:
      - name: reinspection-token-attn
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/token_attn
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            # Stale .pyc on NFS can mask freshly-added symbols across pods.
            find src scripts -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            # InternVL3: frozen + reinspection, both input and generated tokens.
            python scripts/analysis/visualize_token_attention.py \
              --backend internvl3 \
              --image /data/datasets/vsr/images/000000000142.jpg \
              --question "Is the cat to the left of the laptop?" \
              --conditions frozen,reinspection \
              --checkpoint_dir models/internvl3/stage1/epoch_5 \
              --lora_checkpoint_dir models/internvl3/gqa_sg/stage2/epoch_1 \
              --output_dir outputs/token_attn \
              --sample_name vsr_demo \
              --max_new_tokens 16 \
              2>&1 | tee logs/token_attn_internvl3.log

            # --- LLaVA-Next (base global view). Frozen needs the ~15GB weights to
            # --- be present/downloadable; reinspection additionally needs a
            # --- llava_next checkpoint. Uncomment to run.
            # python scripts/analysis/visualize_token_attention.py \
            #   --backend llava_next --conditions frozen \
            #   --image /data/datasets/vsr/images/000000000142.jpg \
            #   --question "Is the cat to the left of the laptop?" \
            #   --output_dir outputs/token_attn --sample_name vsr_demo \
            #   --max_new_tokens 16 \
            #   2>&1 | tee logs/token_attn_llava_next.log
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        resources:
          requests: { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
