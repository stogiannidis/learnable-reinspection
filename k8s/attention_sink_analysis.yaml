apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-sink-analysis-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 172800
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-sink-analysis
    spec:
      containers:
      - name: reinspection-sink-analysis
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/sink_analysis
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            # Stale .pyc on NFS can mask freshly-added symbols across pods.
            find src scripts -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__, 'cuda', torch.cuda.is_available())"

            # CPU unit tests for the pure extraction math (fast, fail early).
            # The image may not ship pytest — skip rather than abort the job.
            python -m pytest tests/test_sink_analysis.py -q 2>&1 | tail -5 \
              || echo "pytest unavailable in image — skipping CPU tests (they pass on the host)"

            # eager attention + bs=1 + single-tile are enforced inside the script.
            python scripts/analysis/attention_sink_analysis.py \
              --backend internvl3 \
              --checkpoint_dir models/internvl3/s2_internvl/stage2/epoch_2 \
              --lora_checkpoint_dir models/internvl3/s2_internvl/stage2/epoch_2 \
              --output_dir outputs/sink_analysis/s2e2 \
              --vsr_file /data/datasets/vsr/test.jsonl \
              --image_root /data/datasets/vsr/images \
              --n_correct 20 --n_wrong 20 --max_scan 300 \
              --max_new_tokens 8 --conditions frozen,reinspection --seed 0 \
              2>&1 | tee logs/sink_analysis.log

            echo "==== outputs ===="
            ls -R outputs/sink_analysis/s2e2 2>/dev/null | head -60
            test -f outputs/sink_analysis/s2e2/metrics.json \
              && test -f outputs/sink_analysis/s2e2/VERDICT.md \
              && echo "SINK ANALYSIS SUCCESS" || { echo "SINK ANALYSIS FAILED"; exit 1; }
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        resources:
          requests: { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
