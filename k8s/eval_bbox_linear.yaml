# Benchmark eval for the bbox_linear Stage-2 checkpoint, epoch_1
# (models/internvl3/bbox_linear/stage2/epoch_1). Standard 64-query re-inspection
# module warm-started from a Stage-1 trained with a Linear+Sigmoid bbox probe
# (instead of the 3-layer MLP). The bbox head is Stage-1-only and saved
# separately (bbox_head.pt); it is NOT used at Stage-2, so the re-inspection
# module is the default 64-query architecture — NO n_queries override needed.
# Matches the comparable baselines exactly (s2_internvl_notile / nq256):
#   same 11 benchmarks, 3 conditions (frozen/lora_only/reinspection), eval CoT
#   protocol, 1024-token decode, batched (bs=64), tiling OFF (default, matches
#   bbox_linear's post-2026-06-04 training). checkpoint_dir AND lora_checkpoint_dir
#   both point at the epoch_1 dir (RI module is loaded from lora_checkpoint_dir
#   first — pairing it with a different LoRA collapses the model).
# Launch with `kubectl create -f` (generateName).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-eval-bboxlin-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-eval-bboxlin
    spec:
      containers:
      - name: reinspection-eval-bboxlin
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/internvl3/bbox_linear
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            find src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            bash src/scripts/run_eval.sh \
              checkpoint_dir=models/internvl3/bbox_linear/stage2/epoch_1 \
              lora_checkpoint_dir=models/internvl3/bbox_linear/stage2/epoch_1 \
              benchmarks='[3dsrbench,blink,cv_bench,gqa_spatial,mindcube,mmvp,realworldqa,srbench,vsr_zeroshot,vstar_bench,whatsup]' \
              eval_condition=reinspection \
              eval_compare=true \
              eval_cot_enabled=true \
              eval_max_new_tokens=1024 \
              eval_batch_size=64 \
              pbar_enabled=true \
              output_file=outputs/internvl3/bbox_linear/eval_stage2_epoch1_compare.json \
              2>&1 | tee logs/eval_bbox_linear_stage2_epoch1.log
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
          - { name: PBAR_API_KEY,  valueFrom: { secretKeyRef: { name: reinspection-secrets, key: PBAR_API_KEY, optional: true } } }
        resources:
          requests: { cpu: 64, memory: "64Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 64, memory: "64Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
