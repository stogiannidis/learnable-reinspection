# Example: create the secret without committing real values.
# Run once (or when keys rotate):
#
#   kubectl create secret generic reinspection-secrets \
#     --namespace eidf098ns \
#     --from-literal=HF_TOKEN="your-hf-token" \
#     --from-literal=WANDB_API_KEY="your-wandb-key" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or from env vars (no secrets in shell history):
#
#   export HF_TOKEN="..."
#   export WANDB_API_KEY="..."
#   kubectl create secret generic reinspection-secrets \
#     --namespace eidf098ns \
#     --from-literal=HF_TOKEN="$HF_TOKEN" \
#     --from-literal=WANDB_API_KEY="$WANDB_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Jobs reference this secret via secretKeyRef (see stage1.yaml, stage2.yaml, job.yaml).
