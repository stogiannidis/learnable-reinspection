# LLaVA-Next batched-vs-unbatched smoke (mirrors k8s/eval_batched_smoke.yaml,
# which validated InternVL3 only). Reinspection condition, same fixed 64-sample
# subset of whatsup + cv_bench at bs=1 then bs=64; diffs per-sample outputs and
# flags correctness flips. LLaVA's _find_insert_positions is mask-derived and
# unit-tested under left-pad, but this is the first end-to-end batched check.
# Launch with `kubectl create -f` (generateName).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-eval-llava-smoke-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-eval-llava-smoke
    spec:
      containers:
      - name: reinspection-eval-llava-smoke
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/llava_next/smoke_bs1 outputs/llava_next/smoke_bs16 outputs/llava_next/smoke_bs64
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            find src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            # Unit-pin the collate contract before the end-to-end check.
            # (pytest is not in the image; install to user site, skip on failure
            # — the end-to-end bs1-vs-bs64 diff below is the binding check.)
            if python3 -m pip install --user -q pytest 2>/dev/null; then
              python3 -m pytest tests/test_batch_collate.py tests/test_insert_positions_padding.py -q
            else
              echo "pytest unavailable and install failed — relying on end-to-end diff"
            fi

            CKPT=models/llava_next/grounding/stage2/epoch_2

            # Two conditions x three batch sizes. frozen is the attribution
            # control: it has NO R-token insertion, so flips there bound the
            # generic HF batched-generation FP noise; reinspection flips beyond
            # that bound would implicate our insert/collate path.
            for COND in reinspection frozen; do
              for BS in 1 16 64; do
                echo "================ ${COND} eval_batch_size=${BS} ================"
                bash src/scripts/run_eval.sh \
                  backend=llava_next \
                  checkpoint_dir=${CKPT} \
                  lora_checkpoint_dir=${CKPT} \
                  output_file=outputs/llava_next/smoke_bs${BS}/compare_${COND}.json \
                  eval_condition=${COND} \
                  eval_compare=false \
                  benchmarks='[whatsup,cv_bench]' \
                  max_samples=64 \
                  eval_batch_size=${BS} \
                  pbar_enabled=true \
                  2>&1 | tee logs/eval_llava_smoke_${COND}_bs${BS}.log
              done
            done

            echo "================ batched-vs-unbatched diff ================"
            python3 - <<'PY'
            import json, os
            ROOT = "outputs/llava_next"
            benches = ["whatsup", "cv_bench"]
            flips = {}
            for cond in ["reinspection", "frozen"]:
                base = {}
                for bench in benches:
                    f = os.path.join(ROOT, "smoke_bs1", f"{cond}_{bench}_samples.json")
                    base[bench] = {r["idx"]: r for r in json.load(open(f))} if os.path.exists(f) else None
                for bs in [16, 64]:
                    for bench in benches:
                        fb = os.path.join(ROOT, f"smoke_bs{bs}", f"{cond}_{bench}_samples.json")
                        if base[bench] is None or not os.path.exists(fb):
                            print(f"{cond}/{bench}/bs{bs}: MISSING dump"); continue
                        da, db = base[bench], {r["idx"]: r for r in json.load(open(fb))}
                        common = sorted(set(da) & set(db))
                        acc_a = sum(da[i]["correct"] for i in common) / len(common)
                        acc_b = sum(db[i]["correct"] for i in common) / len(common)
                        out_diff = [i for i in common if da[i]["model_output"].strip() != db[i]["model_output"].strip()]
                        corr_diff = [i for i in common if da[i]["correct"] != db[i]["correct"]]
                        flips[(cond, bs, bench)] = len(corr_diff)
                        print(f"{cond:12s} bs{bs:<3d} {bench:10s} n={len(common):3d}  "
                              f"acc bs1={acc_a:.4f}  bs{bs}={acc_b:.4f}  d_acc={acc_b-acc_a:+.4f}  "
                              f"text_diff={len(out_diff)}  correctness_flips={len(corr_diff)}")
                        if corr_diff:
                            print("   flips at idx:", corr_diff[:10])
            # Attribution: reinspection flips materially above the frozen control
            # at the same bs implicate the R-insertion/collate path, not FP noise.
            for bs in [16, 64]:
                ri = sum(flips.get(("reinspection", bs, b), 0) for b in benches)
                fz = sum(flips.get(("frozen", bs, b), 0) for b in benches)
                tag = "OK (within generic batching noise)" if ri <= max(2 * fz, fz + 2) \
                      else "SUSPECT — reinspection flips exceed frozen control"
                print(f"bs{bs}: reinspection_flips={ri}  frozen_flips={fz}  -> {tag}")
            PY
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
          - { name: PBAR_API_KEY,  valueFrom: { secretKeyRef: { name: reinspection-secrets, key: PBAR_API_KEY, optional: true } } }
        resources:
          requests: { cpu: 32, memory: "64Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 32, memory: "64Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
