apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-poc-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 18000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-poc
    spec:
      containers:
      - name: reinspection-poc
        image: stogian/reinspection-poc:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            mkdir -p logs
            bash poc/scripts/run_poc.sh 2>&1 | tee logs/poc.log
        terminationMessagePath: "/tmp/my-log"
        terminationMessagePolicy: File
        imagePullPolicy: "Always"
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: reinspection-secrets
                key: HF_TOKEN
          - name: WANDB_API_KEY
            valueFrom:
              secretKeyRef:
                name: reinspection-secrets
                key: WANDB_API_KEY
          - name: USER
            value: "stogian_ph"
          - name: OMP_NUM_THREADS
            value: "4"
        resources:
          requests:
            cpu: 8
            memory: "32Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: 8
            memory: "32Gi"
            nvidia.com/gpu: 1
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /data
            name: nfs
      restartPolicy: Never
      securityContext:
        runAsUser: 30545
        runAsGroup: 4451
        runAsNonRoot: true
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
        name: dshm
      - name: nfs
        nfs:
          server: 10.24.6.66
          path: /
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
# NVIDIA-A100-SXM4-80GB
# NVIDIA-H100-80GB-HBM3
