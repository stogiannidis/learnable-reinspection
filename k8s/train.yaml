# Standard 8x H100 training job. Non-secret env (experiments, OMP, HF_HOME, …)
# lives in src/scripts/run_train.sh; this manifest only injects secrets.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-train-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: train
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs models
            # 8 GPUs: to hold the effective batch constant vs the 4-GPU default,
            # halve the chosen backend's grad_accum by appending overrides, e.g.
            #   stage1_grad_accum=8 stage2_grad_accum=8   (internvl: keeps 512)
            #   stage1_grad_accum=4 stage2_grad_accum=4   (qwen:     keeps 256)
            bash src/scripts/run_train.sh
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        imagePullPolicy: Always
        resources:
          requests: { cpu: 96, memory: "192Gi", nvidia.com/gpu: 8 }
          limits:   { cpu: 96, memory: "192Gi", nvidia.com/gpu: 8 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "96Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
