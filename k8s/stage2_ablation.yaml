# Stage 2 ablation — InternVL3 from a specific Stage-1 checkpoint.
# Set REINSPECTION_EXPERIMENT inline (in the command below) to one of:
#   s2_internvl_grounding  (from grounding Stage-1)
#   s2_internvl_focal      (from focal Stage-1)
#   s2_internvl_kl         (from kl Stage-1)
# Edit stage1_checkpoint in the chosen src/configs/experiment/<name>.yaml
# if the default epoch path is wrong.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-internvl-stage2-ablation-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-internvl-stage2-ablation
    spec:
      containers:
      - name: reinspection-internvl-stage2-ablation
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs models
            REINSPECTION_EXPERIMENT=s2_internvl_grounding REINSPECTION_EXPERIMENT_STAGE2= \
              bash src/scripts/run_train.sh
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        resources:
          requests: { cpu: 16, memory: "128Gi", nvidia.com/gpu: 4 }
          limits:   { cpu: 16, memory: "128Gi", nvidia.com/gpu: 4 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "64Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
