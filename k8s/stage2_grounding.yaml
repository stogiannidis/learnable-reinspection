apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-internvl-stage2-grounding-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-internvl-stage2-grounding
    spec:
      containers:
      - name: reinspection-internvl-stage2-grounding
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            mkdir -p logs models
            bash src/scripts/run_stage2.sh stage1_checkpoint=models/internvl3/grounding/epoch_4/reinspection_module.pt experiment_name=grounding wandb_run_name=internvl-stage2-grounding 2>&1 | tee logs/stage2_grounding.log
        terminationMessagePath: "/tmp/my-log"
        terminationMessagePolicy: File
        imagePullPolicy: "Always"
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: reinspection-secrets
                key: HF_TOKEN
          - name: WANDB_API_KEY
            valueFrom:
              secretKeyRef:
                name: reinspection-secrets
                key: WANDB_API_KEY
          - name: OMP_NUM_THREADS
            value: "4"
          - name: HF_HOME
            value: "/data/Huggingface"
        resources:
          requests:
            cpu: 16
            memory: "128Gi"
            nvidia.com/gpu: 4
          limits:
            cpu: 16
            memory: "128Gi"
            nvidia.com/gpu: 4
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /data
            name: nfs
      restartPolicy: Never
      securityContext:
        runAsUser: 30545
        runAsGroup: 4451
        runAsNonRoot: true
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: "64Gi"
        name: dshm
      - name: nfs
        nfs:
          server: 10.24.6.66
          path: /
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
