apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-eval-debug-s1only-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-eval-debug-s1only
    spec:
      containers:
      - name: reinspection-eval-debug-s1only
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/internvl3/grounding/debug_s1only
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            find src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            # Variant 2: Stage-1 reinspection ONLY, no LoRA.
            # checkpoint_dir holds reinspection_module.pt, no lora_weights subdir,
            # and we deliberately omit lora_checkpoint_dir so no LoRA is applied.
            bash src/scripts/run_eval.sh \
              checkpoint_dir=models/internvl3/stage1/epoch_5 \
              ~lora_checkpoint_dir \
              output_file=outputs/internvl3/grounding/debug_s1only/eval_s1only.json \
              eval_condition=reinspection \
              eval_compare=false \
              'benchmarks=[vsr]' \
              max_samples=8 \
              2>&1 | tee logs/eval_debug_s1only.log
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        resources:
          requests: { cpu: 8, memory: "32Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 8, memory: "32Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
