apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-prepare-training-data-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-prepare-training-data
    spec:
      containers:
      - name: reinspection-prepare-training-data
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs
            # Run datasets sequentially to keep peak RSS under control.
            # cambrian (fallback): GQA testdev + VG local annotations → cambrian_spatial/
            python -m src.data.prepare_training_data \
              --output_dir /data/datasets \
              --datasets cambrian_spatial \
              --cambrian_source fallback \
              --cambrian_max_samples 100000 \
              --vg_input_dir /data/datasets/vg \
              --seed 42 \
              2>&1 | tee -a logs/prepare_training_data.log
            # vg_grounding: VG region descriptions → Stage 1 grounding pairs
            python -m src.data.prepare_training_data \
              --output_dir /data/datasets \
              --datasets vg_grounding \
              --vg_input_dir /data/datasets/vg \
              --vg_max_samples 500000 \
              --seed 42 \
              2>&1 | tee -a logs/prepare_training_data.log
            # vg_spatial: VG relationships → Stage 2 spatial VQA pairs
            python -m src.data.prepare_training_data \
              --output_dir /data/datasets \
              --datasets vg_spatial \
              --vg_input_dir /data/datasets/vg \
              --vg_max_samples 200000 \
              --seed 42 \
              2>&1 | tee -a logs/prepare_training_data.log
            # grefcoco: gRefCOCO → Stage 1 grounding (reads from HF cache)
            python -m src.data.prepare_training_data \
              --output_dir /data/datasets \
              --datasets grefcoco \
              --coco_image_dir /data/datasets/coco/train2017 \
              --seed 42 \
              2>&1 | tee -a logs/prepare_training_data.log
        terminationMessagePath: "/tmp/my-log"
        terminationMessagePolicy: File
        imagePullPolicy: "Always"
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: reinspection-secrets
                key: HF_TOKEN
          - name: OMP_NUM_THREADS
            value: "8"
          - name: HF_HOME
            value: "/data/Huggingface"
          - name: TRANSFORMERS_CACHE
            value: "/data/Huggingface"
        resources:
          requests:
            cpu: 16
            memory: "128Gi"
          limits:
            cpu: 16
            memory: "128Gi"
        volumeMounts:
          - mountPath: /data
            name: nfs
      restartPolicy: Never
      securityContext:
        runAsUser: 30545
        runAsGroup: 4451
        runAsNonRoot: true
      volumes:
      - name: nfs
        nfs:
          server: 10.24.6.66
          path: /
