apiVersion: batch/v1
kind: Job
metadata:
  generateName: reinspection-motivation-
  namespace: eidf098ns
  labels:
    kueue.x-k8s.io/queue-name: eidf098ns-user-queue
spec:
  ttlSecondsAfterFinished: 36000
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      name: reinspection-motivation
    spec:
      containers:
      - name: reinspection-motivation
        image: stogian/l_reinspection:latest
        workingDir: /data/users/stogian/learnable-reinspection
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            mkdir -p logs outputs/motivation
            export OMP_NUM_THREADS=4
            export HYDRA_FULL_ERROR=1
            export HF_HOME=/data/Huggingface
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            export WANDB_MODE=offline
            export PYTHONDONTWRITEBYTECODE=1

            # Stale .pyc on the shared NFS can mask newly added symbols
            # (e.g. ImportError: cannot import name 'load_processor').
            find src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            # Frozen-only motivation across all three backends.
            for BACKEND in internvl3 qwen25vl gemma4; do
              echo "=== Motivation: ${BACKEND} (frozen) ==="
              BACKEND="${BACKEND}" \
              CKPT_DIR="" \
              OUTPUT_FILE="outputs/motivation/motivation_${BACKEND}_results.json" \
              MOTIVATION_LOG="logs/motivation_${BACKEND}.log" \
              bash src/scripts/run_motivation.sh
            done

            echo "=== Generating figures ==="
            python -m src.plot_motivation \
              --output_dir outputs/motivation/figures \
              2>&1 | tee -a logs/motivation_plot.log
        imagePullPolicy: Always
        env:
          - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: reinspection-secrets, key: HF_TOKEN } } }
          - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: reinspection-secrets, key: WANDB_API_KEY } } }
        resources:
          requests: { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
          limits:   { cpu: 16, memory: "64Gi", nvidia.com/gpu: 1 }
        volumeMounts:
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /data,    name: nfs }
      restartPolicy: Never
      securityContext: { runAsUser: 30545, runAsGroup: 4451, runAsNonRoot: true }
      volumes:
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
      - name: nfs
        nfs: { server: 10.24.6.66, path: / }
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
