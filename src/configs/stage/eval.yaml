# @package _global_
# Logged to W&B; evaluate.py does not branch on this field.
stage: 2
checkpoint_dir: models/internvl3/stage1/epoch_5
lora_checkpoint_dir: models/internvl3/stage2/epoch_2
output_file: outputs/internvl3/eval_results.json
benchmarks: [vsr_zeroshot, gqa_spatial, whatsup, 3dsrbench, mindcube, blink, srbench, qspatial, embspatial, realworldqa, cv_bench, vstar_bench, mmvp]
eval_condition: reinspection
eval_compare: true
# Omit path to always run frozen (vanilla) on GPU; set to a JSON path to load/save cached frozen results.
frozen_cache_file: null
max_samples: -1
eval_cot_enabled: true
eval_cot_prompt: "Think step by step. Then provide the final answer on a separate line starting with 'Final answer:'."
eval_max_new_tokens: 128
# Batched generation verified after the insert-position fix; bs=16 matches bs=1 up
# to greedy FP/tie noise. Use eval_batch_size=1 for bit-exact reproduction.
eval_batch_size: 16
pbar_enabled: true
