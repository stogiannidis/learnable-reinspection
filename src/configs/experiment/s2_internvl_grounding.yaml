# @package _global_
# Stage 2 ablation — InternVL3 from grounding Stage-1 checkpoint.
# Edit `stage1_checkpoint` to match the epoch you want to use.
defaults:
  - override /backend: internvl3
  - override /stage: stage2
  - override /stage2_datasets: default

stage1_checkpoint: models/internvl3/stage1/epoch_5/reinspection_module.pt
wandb_run_name: internvl-stage2-grounding
experiment_name: grounding

# Ablation job overrides live here instead of in the Kubernetes manifest.
stage2_batch_size: 16
stage2_grad_accum: 8
wandb_gradient_log_interval: 100
num_workers: 8
dataloader_prefetch_factor: 4

# Weak auxiliary bbox-grounding stream during Stage-2 NTP.
stage2_train_reinspection: true
stage2_aux_grounding_weight: 0.05
stage2_aux_every_n_steps: 4
stage2_aux_batch_size: 2
