# @package _global_
# Stage 2 — spatial VQA. LLaVA-Next-Mistral-7B starting from a Stage-1 grounding
# checkpoint. Edit ``stage1_checkpoint`` to point at the epoch you trained.
defaults:
  - override /backend: llava_next
  - override /stage: stage2
  - override /stage2_datasets: default

stage1_checkpoint: models/llava_next/grounding/stage1/epoch_5/reinspection_module.pt
wandb_run_name: llava_next-stage2-grounding
experiment_name: grounding

# Match the InternVL3 grounding stage-2 schedule (same effective batch=128).
stage2_batch_size: 16
stage2_grad_accum: 8
wandb_gradient_log_interval: 100
num_workers: 8
dataloader_prefetch_factor: 4

# Weak auxiliary bbox-grounding stream during Stage-2 NTP.
stage2_train_reinspection: true
stage2_aux_grounding_weight: 0.05
stage2_aux_every_n_steps: 4
stage2_aux_batch_size: 2
