# @package _global_
backend: internvl3
model_name_or_path: OpenGVLab/InternVL3-8B-hf
deepspeed_config: reinspection_vlm/configs/internvl3/deepspeed_z3.json
wandb_project: reinspection-internvl3

# Re-Inspection Module
d_model: 3584
d_bottleneck: 512
n_queries: 64
n_heads: 8
ffn_mult: 4
dropout: 0.0

# Stage 1
stage1_lr_module: 1.0e-4
stage1_lr_projector: 1.0e-5
stage1_epochs: 5
stage1_batch_size: 8
stage1_grad_accum: 8
stage1_warmup_ratio: 0.03
stage1_attn_loss_weight: 0.5
stage1_train_projector: false
stage1_attn_loss_type: kl

# Stage 2
stage2_lr_module: 5.0e-5
stage2_lr_lora: 2.0e-5
stage2_epochs: 4
stage2_batch_size: 4
stage2_grad_accum: 8
stage2_warmup_ratio: 0.05
lora_r: 32

# Data
max_pixels: 1003520
min_pixels: 3136
crop_to_patches_stage1: false
crop_to_patches_stage2: true

# Misc
seed: 42
bf16: true
gradient_checkpointing: true
max_grad_norm: 1.0
